name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (fmt, vet, race tests, generated types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race detector)
        run: go test -race -count=1 ./...

      - name: Generated TypeScript types are up to date
        run: |
          go generate ./internal/dto/...
          git diff --exit-code -- web/src/types/generated.ts || \
            (echo "web/src/types/generated.ts is stale: run 'make generate-types' and commit the result" && exit 1)

  web:
    name: Web (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t go-red:ci .

      - name: Smoke test
        run: |
          docker run -d --name go-red -p 8080:8080 go-red:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs go-red
          exit 1
